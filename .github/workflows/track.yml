name: 네이버 노출 추적

on:
  schedule:
    # UTC 기준 00:00 = KST 09:00 (매일)
    - cron: "0 0 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # CSV/대시보드 커밋용

concurrency:
  group: rank-tracking
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 순위 수집
        env:
          # 신규 — NAVER API HUB (둘 다 있으면 이쪽을 쓴다)
          NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
          NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
          # 레거시 — developers.naver.com 키가 이미 있는 경우에만
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python src/track.py

      - name: 대시보드 생성
        run: python src/build_dashboard.py

      - name: 커밋
        run: |
          git config user.name  "rank-bot"
          git config user.email "rank-bot@users.noreply.github.com"
          git add data/rankings.csv docs/index.html
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "추적: $(date -u -d '+9 hours' +%Y-%m-%d)"
            git push
          fi
