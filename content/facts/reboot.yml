# 리부트(철산) 사실 바구니 — 수기입
#
# 여기 적힌 것만 글에 들어간다. AI는 이 목록 밖의 수치를 지어내지 못하도록
# 프롬프트에서 막아두었고, 품질 게이트가 인용 개수를 센다.
#
# 규칙
#  - fact 는 한 문장. 숫자·날짜·고유명사를 최대한 넣는다.
#  - source 는 어디서 나온 값인지. 나중에 사실 확인할 때 쓴다.
#  - caution 이 붙은 항목은 그 조건이 프롬프트로 함께 넘어간다.
#  - 확인 안 된 값은 넣지 않는다. 빈 바구니가 틀린 바구니보다 낫다.

center: Reboot
label: "리부트 팀트레이닝 (철산/광명)"
brand_name: "리부트 광명 철산점"
tagline: "뻔한 운동 말고 'FUN'한 운동"

facts:
  # ── 브랜드 · 자격 ──────────────────────────────────────────
  - id: hyrox-partner
    fact: "리부트 팀트레이닝은 HYROX 공식 제휴 센터다."
    source: "제휴 자격 보유"
    tags: [하이록스, 브랜드, 차별점]

  - id: renewal-open
    fact: "2025년 12월 리뉴얼 오픈해 시설과 장비가 새것이다."
    source: "내부 기록"
    tags: [시설, 브랜드]

  - id: group-format
    fact: "개인 PT가 아니라 코치가 붙는 그룹 팀트레이닝 방식이다."
    source: "운영 방식"
    tags: [운동구성, 초보]

  # ── 위치 ────────────────────────────────────────────────
  - id: station-30sec
    fact: "철산역 1번 출구에서 도보 30초 거리다."
    source: "실측"
    tags: [위치, 접근성, 직장인]

  - id: address
    fact: "광명시 철산로 20 야우리빌딩 4층."
    source: "네이버 플레이스 등록 주소"
    tags: [위치]

  # ── 운영 시간 ─────────────────────────────────────────────
  - id: weekday-schedule
    fact: "월~금은 하루 6타임 운영한다. 오전 06:40·09:30·10:30, 오후 18:00·19:15·21:00 시작."
    source: "2026-09 스케줄표"
    tags: [시간표, 직장인, 초보]

  - id: early-morning
    fact: "가장 이른 수업이 06:40에 시작해 07:40에 끝난다. 출근 전에 한 타임 끝낼 수 있다."
    source: "2026-09 스케줄표"
    tags: [시간표, 직장인, 새벽운동]

  - id: late-evening
    fact: "마지막 수업이 21:00에 시작해 22:00에 끝난다. 야근 후에도 참여 가능하다."
    source: "2026-09 스케줄표"
    tags: [시간표, 직장인]

  - id: saturday
    fact: "토요일은 오전 10:00~11:30 한 타임, 평일보다 30분 긴 90분 수업이다."
    source: "2026-09 스케줄표"
    tags: [시간표, 주말]

  # ── 프로그램 ──────────────────────────────────────────────
  - id: curriculum-week
    fact: "요일별 프로그램이 고정돼 있다. 월 HYROX·ROX Build / 화 WEIGHT / 수 HYBRID / 목 WEIGHT / 금 HYROX·ROX Race / 토 LIFTING·YOGA."
    source: "2026-09 커리큘럼표"
    tags: [운동구성, 초보, 하이록스]

  - id: hyrox-twice-weekly
    fact: "HYROX 전용 수업이 주 2회(월·금) 편성돼 있고, 월요일은 ROX Build, 금요일은 ROX Race로 성격이 다르다."
    source: "2026-09 커리큘럼표"
    tags: [하이록스, 운동구성]

  # ── 장비 ────────────────────────────────────────────────
  - id: equip-skierg
    fact: "스키에르그 3대를 보유하고 있다."
    source: "장비 현황 — 대표 확인"
    tags: [하이록스, 시설, 장비]

  - id: equip-rowing
    fact: "로잉머신 4대를 보유하고 있다."
    source: "장비 현황 — 대표 확인"
    tags: [하이록스, 시설, 장비]

  - id: equip-treadmill
    fact: "무동력 트레드밀 2대를 보유하고 있다."
    source: "장비 현황 — 대표 확인"
    tags: [하이록스, 시설, 장비]

  - id: equip-sled
    fact: "공식 규격 슬레드 2대를 12.5m 카펫 2레인에 두고, 푸시와 풀을 한 공간에서 연습한다."
    source: "장비 현황 — 대표 확인"
    tags: [하이록스, 시설, 장비, 차별점]

  - id: equip-sandbag
    fact: "샌드백은 대회 규격과 같은 20kg(남)·10kg(여)를 갖추고 있다."
    source: "장비 현황 — 대표 확인"
    tags: [하이록스, 장비, 규격]

  - id: equip-burpee-space
    fact: "버피 브로드점프 80m를 소화할 거리가 센터 안에 확보돼 있다."
    source: "장비 현황 — 대표 확인"
    tags: [하이록스, 시설, 장비]

  - id: equip-full-stations
    fact: "월볼, 샌드백 런지, 덤벨, 케틀벨, 바벨까지 규격 기준으로 갖춰 8개 스테이션을 전부 연습할 수 있다."
    source: "장비 현황 — 대표 확인"
    tags: [하이록스, 시설, 장비, 차별점]

  - id: hyrox-official-spec
    fact: "하이록스 공식 규격에 맞춘 구성으로 시뮬레이션이 가능하다."
    source: "센터 구성 — 대표 확인"
    tags: [하이록스, 시설, 차별점]

  - id: hyrox-sim-value
    fact: "대회 전에 실제 규격으로 스테이션을 돌아보면 구간별 페이스 배분을 미리 잡을 수 있다."
    source: "HYROX 공식 제휴 센터 운영 근거"
    tags: [하이록스, 초보, 대회준비]

  # ── 시설 · 위생 ───────────────────────────────────────────
  - id: facility-shower-booths
    fact: "샤워실은 전부 개인 부스다. 남자 3개, 여자 4개."
    source: "시설 — 대표 확인"
    tags: [시설, 차별점, 직장인]

  - id: facility-dyson
    fact: "샤워실에 다이슨 드라이어를 비치했다."
    source: "시설 — 대표 확인"
    tags: [시설, 차별점]

  - id: facility-towel
    fact: "수건은 호텔에서 쓰는 40수를 쓰고, 운동용 땀수건은 따로 관리한다."
    source: "시설 — 대표 확인"
    tags: [시설, 차별점]

  - id: facility-laundry
    fact: "수건은 매일 세탁한다."
    source: "운영 방식 — 대표 확인"
    tags: [시설, 위생, 차별점]

  - id: facility-commute
    fact: "샤워 시설이 갖춰져 있어 06:40 새벽 수업 후 바로 출근이 가능하다."
    source: "시설 + 시간표"
    tags: [시설, 직장인, 새벽운동]

  # ── 코치 ────────────────────────────────────────────────
  - id: coach-scaling
    fact: "같은 수업 안에서 회원 수준에 맞춰 강도와 동작을 조절해준다. 초보는 무게 없이, 숙련자는 정식 동작으로 같은 프로그램을 돈다."
    source: "운영 방식 — 대표 확인"
    tags: [코치, 초보, 운동구성]

  - id: coach-progression
    fact: "턱걸이 0개에서 10개, 크로스핏 무경험에서 클린까지 — 단계별로 끌어올린 사례가 실제로 나온다."
    source: "위 회원 사례에서 확인"
    tags: [코치, 결과, 초보]

  - id: coach-atmosphere
    fact: "코치가 친절하다는 점이 회원 후기에서 반복적으로 언급된다."
    source: "회원 후기 — 대표 확인"
    tags: [코치, 분위기]

  - id: case-hyrox-first
    fact: "하이록스가 처음인 회원도 코치가 스테이션별 동작을 개별로 잡아주며 시작한다."
    source: "회원 후기 및 운영 방식 — 대표 확인"
    tags: [하이록스, 초보, 코치]

  # ── 회원 성과 ─────────────────────────────────────────────
  - id: case-weight-8kg
    fact: "6개월간 다닌 회원이 8kg를 감량했다."
    source: "내부 기록 — 대표 확인"
    tags: [후기, 결과, 다이어트]
    caution: "감량 성과는 개인차가 크다. 글에 쓸 때 \"개인차가 있습니다\" 를 같은 단락에 병기하고, 모든 회원이 같은 결과를 얻는다는 뉘앙스로 쓰지 않는다."

  - id: case-weight-7kg-wedding
    fact: "결혼을 앞둔 회원이 주 2회 참여로 5개월간 7kg를 감량했다."
    source: "내부 기록 — 대표 확인"
    tags: [후기, 결과, 다이어트, 주2회]
    caution: "위와 동일. \"주 2회로도 가능\" 이라는 각도로 쓸 때 특히 개인차 병기가 필요하다."

  - id: case-pullup
    fact: "턱걸이를 한 개도 못 하던 회원이 지금은 한 번에 10개씩 한다."
    source: "내부 기록 — 대표 확인"
    tags: [후기, 결과, 초보, 근력]

  - id: case-crossfit-skill
    fact: "크로스핏 경험이 전혀 없던 회원이 토투바와 클린까지 수행하게 됐다."
    source: "내부 기록 — 대표 확인"
    tags: [후기, 결과, 초보, 기술]

  # ── 체험 · 혜택 ───────────────────────────────────────────
  - id: free-trial
    fact: "그룹 PT 1일 무료 체험을 제공한다."
    source: "2026-09 프로모션"
    tags: [체험, 전환]

  - id: review-locker
    fact: "네이버 리뷰를 남기면 개인 락커를 제공한다."
    source: "2026-09 운영 정책"
    tags: [혜택, 리뷰]
    caution: "대가 제공 리뷰다. 글에 쓸 때 별점이나 특정 문구를 요구하는 표현은 절대 넣지 말 것 (\"5점 부탁\", \"하이록스 언급해주세요\" 등은 어뷰징 제재 사유). 안내 문구는 \"리뷰 작성 시 개인 락커 제공\" 까지만 쓰고, 내용·평점 조건은 달지 않는다. 회원에게 안내할 때도 \"솔직한 후기\" 라고만 하고, 리뷰 본문에 대가성 표기를 요청한다."

  # ── 하이록스 공식 규격 (외부 사실) ────────────────────────────────
  - id: hyrox-8-stations
    fact: "하이록스는 1km 러닝과 8개 스테이션을 번갈아 수행한다. 순서는 스키에르그 1000m, 슬레드 푸시 50m, 슬레드 풀 50m, 버피 브로드점프 80m, 로잉 1000m, 파머스캐리 200m, 샌드백 런지 100m, 월볼 100회다."
    source: "HYROX 공식 홈페이지 hyrox.com/the-fitness-race (2026-09 확인)"
    tags: [하이록스, 초보, 규격]

  - id: hyrox-weights
    fact: "오픈 부문 기준 중량은 슬레드 푸시 152kg(남)·102kg(여), 슬레드 풀 103kg(남)·78kg(여), 파머스캐리 24kg(남)·16kg(여), 샌드백 런지 20kg(남)·10kg(여), 월볼 6kg(남)·4kg(여)다."
    source: "HYROX 공식 홈페이지 hyrox.com/the-fitness-race (2026-09 확인)"
    tags: [하이록스, 규격, 초보]
