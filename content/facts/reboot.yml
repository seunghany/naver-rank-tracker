  #   #   최상급 표현은 표시광고법상 실증 자료가 필요하고, 검색에서도
  #   #   "가장 좋은" 보다 "샤워실 3개" 같은 구체가 훨씬 잘 먹힙니다.
  #
  # ── 회원 성과: 감량 ───────────────────────────────────────
  - id: case-weight-8kg
    fact: "6개월간 다닌 회원이 8kg를 감량했다."
    source: "내부 기록 — 대표 확인"
    tags: [후기, 결과, 다이어트]
    caution: >
      감량 성과는 개인차가 크다. 글에 쓸 때 "개인차가 있습니다" 를 같은 단락에 병기하고,
      모든 회원이 같은 결과를 얻는다는 뉘앙스로 쓰지 않는다.

  - id: case-weight-7kg-wedding
    fact: "결혼을 앞둔 회원이 주 2회 참여로 5개월간 7kg를 감량했다."
    source: "내부 기록 — 대표 확인"
    tags: [후기, 결과, 다이어트, 주2회]
    caution: >
      위와 동일. "주 2회로도 가능" 이라는 각도로 쓸 때 특히 개인차 병기가 필요하다.

  # ── 회원 성과: 운동 능력 ──────────────────────────────────
  - id: case-pullup
    fact: "턱걸이를 한 개도 못 하던 회원이 지금은 한 번에 10개씩 한다."
    source: "내부 기록 — 대표 확인"
    tags: [후기, 결과, 초보, 근력]

  - id: case-crossfit-skill
    fact: "크로스핏 경험이 전혀 없던 회원이 토투바와 클린까지 수행하게 됐다."
    source: "내부 기록 — 대표 확인"
    tags: [후기, 결과, 초보, 기술]

  - id: case-hyrox-first
    fact: "하이록스가 처음인 회원도 코치가 스테이션별 동작을 개별로 잡아주며 시작한다."
    source: "회원 후기 및 운영 방식 — 대표 확인"
    tags: [하이록스, 초보, 코치]

  # ── 코치 ──────────────────────────────────────────────────
  - id: coach-scaling
    fact: "같은 수업 안에서 회원 수준에 맞춰 강도와 동작을 조절해준다. 초보는 무게 없이, 숙련자는 정식 동작으로 같은 프로그램을 돈다."
    source: "운영 방식 — 대표 확인"
    tags: [코치, 초보, 운동구성]

  - id: coach-progression
    fact: "턱걸이 0개에서 10개, 크로스핏 무경험에서 클린까지 — 단계별로 끌어올린 사례가 실제로 나온다."
    source: "위 회원 사례에서 확인"
    tags: [코치, 결과, 초보]

  - id: coach-atmosphere
    fact: "코치가 친절하다는 점이 회원 후기에서 반복적으로 언급된다."
    source: "회원 후기 — 대표 확인"
    tags: [코치, 분위기]

  # ── 하이록스 시뮬레이션 ───────────────────────────────────
  - id: hyrox-official-spec
    fact: "하이록스 공식 규격에 맞춘 구성으로 시뮬레이션이 가능하다."
    source: "센터 구성 — 대표 확인"
    tags: [하이록스, 시설, 차별점]

  - id: hyrox-sim-value
    fact: "대회 전에 실제 규격으로 스테이션을 돌아보면 구간별 페이스 배분을 미리 잡을 수 있다."
    source: "HYROX 공식 제휴 센터 운영 근거"
    tags: [하이록스, 초보, 대회준비]

  # ── 시설 ──────────────────────────────────────────────────
  - id: facility-shower
    fact: "호텔식 프리미엄 샤워실을 갖추고 있다."
    source: "시설 — 대표 확인"
    tags: [시설, 차별점, 직장인]

  - id: facility-private
    fact: "개인실이 마련되어 있다."
    source: "시설 — 대표 확인"
    tags: [시설, 차별점]

  - id: facility-commute
    fact: "샤워 시설이 갖춰져 있어 06:40 새벽 수업 후 바로 출근이 가능하다."
    source: "시설 + 시간표"
    tags: [시설, 직장인, 새벽운동]

