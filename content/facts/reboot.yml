# 리부트(철산) 사실 바구니 — 수기입
#
# 여기 적힌 것만 글에 들어간다. AI는 이 목록 밖의 수치를 지어내지 못하도록
# 프롬프트에서 막아두었고, 품질 게이트가 인용 개수를 센다.
#
# 규칙
#  - fact 는 한 문장. 숫자·날짜·고유명사를 최대한 넣는다.
#  - source 는 어디서 나온 값인지. 나중에 사실 확인할 때 쓴다.
#  - tags 는 어떤 글에 쓸지 고르는 용도.
#  - 확인 안 된 값은 넣지 않는다. 빈 바구니가 틀린 바구니보다 낫다.
#  - caution 이 붙은 항목은 글에 쓸 때 조건이 있다. 아래 각 항목 참고.

center: Reboot
label: 리부트 팀트레이닝 (철산/광명)
brand_name: 리부트 광명 철산점
tagline: 뻔한 운동 말고 'FUN'한 운동

facts:
  # ── 브랜드 · 자격 ─────────────────────────────────────────
  - id: hyrox-partner
    fact: "리부트 팀트레이닝은 HYROX 공식 제휴 센터다."
    source: "제휴 자격 보유"
    tags: [하이록스, 브랜드, 차별점]

  - id: renewal-open
    fact: "2025년 12월 리뉴얼 오픈해 시설과 장비가 새것이다."
    source: "내부 기록"
    tags: [시설, 브랜드]

  # ── 위치 ──────────────────────────────────────────────────
  - id: station-30sec
    fact: "철산역 1번 출구에서 도보 30초 거리다."
    source: "실측"
    tags: [위치, 접근성, 직장인]

  - id: address
    fact: "광명시 철산로 20 야우리빌딩 4층."
    source: "네이버 플레이스 등록 주소"
    tags: [위치]

  # ── 운영 시간 ─────────────────────────────────────────────
  - id: weekday-schedule
    fact: "월~금은 하루 6타임 운영한다. 오전 06:40·09:30·10:30, 오후 18:00·19:15·21:00 시작."
    source: "2026-09 스케줄표"
    tags: [시간표, 직장인, 초보]

  - id: early-morning
    fact: "가장 이른 수업이 06:40에 시작해 07:40에 끝난다. 출근 전에 한 타임 끝낼 수 있다."
    source: "2026-09 스케줄표"
    tags: [시간표, 직장인, 새벽운동]

  - id: late-evening
    fact: "마지막 수업이 21:00에 시작해 22:00에 끝난다. 야근 후에도 참여 가능하다."
    source: "2026-09 스케줄표"
    tags: [시간표, 직장인]

  - id: saturday
    fact: "토요일은 오전 10:00~11:30 한 타임, 평일보다 30분 긴 90분 수업이다."
    source: "2026-09 스케줄표"
    tags: [시간표, 주말]

  # ── 프로그램 ──────────────────────────────────────────────
  - id: curriculum-week
    fact: "요일별 프로그램이 고정돼 있다. 월 HYROX·ROX Build / 화 WEIGHT / 수 HYBRID / 목 WEIGHT / 금 HYROX·ROX Race / 토 LIFTING·YOGA."
    source: "2026-09 커리큘럼표"
    tags: [운동구성, 초보, 하이록스]

  - id: hyrox-twice-weekly
    fact: "HYROX 전용 수업이 주 2회(월·금) 편성돼 있고, 월요일은 ROX Build, 금요일은 ROX Race로 성격이 다르다."
    source: "2026-09 커리큘럼표"
    tags: [하이록스, 운동구성]

  - id: group-format
    fact: "개인 PT가 아니라 코치가 붙는 그룹 팀트레이닝 방식이다."
    source: "운영 방식"
    tags: [운동구성, 초보]

  # ── 체험 · 혜택 ───────────────────────────────────────────
  - id: free-trial
    fact: "그룹 PT 1일 무료 체험을 제공한다."
    source: "2026-09 프로모션"
    tags: [체험, 전환]

  - id: review-locker
    fact: "네이버 리뷰를 남기면 개인 락커를 제공한다."
    source: "2026-09 운영 정책"
    tags: [혜택, 리뷰]
    caution: >
      대가 제공 리뷰다. 글에 쓸 때 별점이나 특정 문구를 요구하는 표현은 절대 넣지 말 것
      ("5점 부탁", "하이록스 언급해주세요" 등은 어뷰징 제재 사유).
      안내 문구는 "리뷰 작성 시 개인 락커 제공" 까지만 쓰고, 내용·평점 조건은 달지 않는다.
      회원에게 안내할 때도 "솔직한 후기" 라고만 하고, 리뷰 본문에 대가성 표기를 요청한다.

  # ── 아직 비어 있는 칸 ─────────────────────────────────────
