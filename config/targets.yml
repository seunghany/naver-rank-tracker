# 블로그 검색은 100개씩 페이지를 넘기며 확인한다 (start 상한 1000 → 최대 10페이지).
# API가 2페이지부터 앞 글을 다시 섞어 주므로 페이지 수 x 100 이 확인 범위가 아니다.
# 2026-10-02 실측: 3페이지 = 서로 다른 글 약 160개, 10페이지 = 약 340~380개.
# 키워드 60개 x 10페이지 = 하루 약 600회 (무료 한도 25,000회).
blog_page_size: 100
blog_pages: 10

centers:
  - name: Reboot
    label: 리부트(철산)
    # 네이버 플레이스 ID — 리뷰·별점 자동 수집에 쓴다 (src/fetch_signals.py)
    # map.naver.com/p/entry/place/<이 숫자>  · 업체명: 리부트 팀트레이닝
    place_id: "1066371237"
    # 지역검색 결과의 업체명이 이 중 하나와 일치하면 '우리'로 판정
    place_aliases:
      - 리부트 팀트레이닝
      - 리부트팀트레이닝
      - 리부트
    # blog.naver.com/<여기> 의 아이디. 실제 값으로 반드시 교체할 것
    blog_ids:
      - reboot_teamtraining
    # 검색량 순으로 정렬. # 뒤 숫자 = 네이버 데이터랩 12개월 합계, 광명헬스장=100 기준 상대값
    # (2025-09 ~ 2026-08 조회). 0 = 데이터랩 집계 기준 미달(검색이 거의 없음)
    keywords:
      - 철산헬스장        # 206
      - 광명헬스장        # 100
      - 철산역헬스장      # 90
      - 철산PT            # 42
      - 철산헬스          # 30
      - 광명크로스핏      # 19
      - 철산동헬스장      # 15
      - 광명PT            # 8
      - 철산크로스핏      # 8
      - 철산역PT          # 3
      - 철산역 헬스       # 2
      - 철산하이록스      # 1 (2026-05부터 검색 시작, 최근 월 기준 약 4)
      - 광명하이록스      # 1
      - 철산그룹PT        # 0
      - 철산역 크로스핏   # 0
      - 철산역 운동       # 0
      - 철산역 하이록스   # 0
      - 철산역 그룹피티   # 0
      - 철산팀트레이닝    # 0
      - 광명그룹PT        # 0
      - 광명그룹운동      # 0
    # 회원들이 실제로 가장 많이 검색하는 키워드 — 대시보드에서 ★로 강조
    focus_keywords:
      - 철산헬스장
      - 광명헬스장
      - 철산역헬스장
      - 철산PT
    # 센터 핵심 키워드 — 우리 수업(그룹PT 팀트레이닝 · HYROX 공식 제휴 · 크로스핏 스타일)과 바로 이어지고
    # 블로그로 집중 공략 중인 키워드. 대시보드에서 ◆로 구분한다. 검색량(★)과는 별개 기준.
    # 근거: 블로그 글 머리말 집계 2026-10-25 (하이록스 35편 · 크로스핏 12편 · 그룹PT/PT 6편).
    core_keywords:
      - 철산하이록스
      - 광명하이록스
      - 철산그룹PT
      - 철산PT
      - 철산크로스핏
      - 광명크로스핏
      - 하이록스
      - 리부트팀트레이닝
    # 니즈 기반 키워드 — 지역명이 없어 지역검색(플레이스)으로는 잡히지 않는다.
    # 블로그만 추적한다. # 뒤 숫자는 위 키워드와 같은 스케일(광명헬스장=100).
    # 데이터랩 2025-09~2026-08 조회, 2026-09-23 기준.
    # 전국 키워드라 팀포이즈와 실제 검색량은 같다. 광명헬스장=광교헬스장의 23.7%이므로
    # 팀포이즈 쪽 값 x4.22 로 환산했다.
    needs_keywords:
      - 크로스핏          # 11427
      - 하이록스          # 9613
      - 뱃살빼는운동      # 3549
      - 단기간다이어트    # 1177
      - 서킷트레이닝      # 679
      - 급찐급빠          # 418
      - 그룹운동          # 76
      - 크로스핏초보      # 48
      - 직장인운동        # 15

    # 브랜드 키워드 — 우리 이름으로 찾는 사람. 블로그만 추적한다.
    # 참고(같은 스케일, 광명헬스장=100): 클리어짐 195 · 위무브트레이닝 65.
    # 경쟁사 브랜드 검색이 우리보다 36~108배 크다.
    brand_keywords:
      - 리부트팀트레이닝  # 1.8
      # '리부트' 단독은 게임·영화 등 일반어가 섞여 추적에서 제외했다.

    # 같은 상권 경쟁사 — 지역검색 상위 3위 안에 잡히면 우리와 나란히 비교한다
    competitors:
      - label: 위무브트레이닝
        aliases:
          - 위무브트레이닝
          - 위무브
      - label: 크로스핏 어셈블
        aliases:
          - 크로스핏어셈블
          - 어셈블

