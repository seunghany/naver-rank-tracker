# 블로그 검색은 100개씩 페이지를 넘기며 확인한다.
# blog_pages: 3 이면 최대 300위까지 확인 (API가 거부하면 자동으로 멈춤)
blog_page_size: 100
blog_pages: 3

centers:
  - name: Reboot
    label: 리부트(철산)
    # 지역검색 결과의 업체명이 이 중 하나와 일치하면 '우리'로 판정
    place_aliases:
      - 리부트 팀트레이닝
      - 리부트팀트레이닝
      - 리부트
    # blog.naver.com/<여기> 의 아이디. 실제 값으로 반드시 교체할 것
    blog_ids:
      - reboot_teamtraining
    # 검색량 순으로 정렬. # 뒤 숫자 = 네이버 데이터랩 12개월 합계, 광명헬스장=100 기준 상대값
    # (2025-09 ~ 2026-08 조회). 0 = 데이터랩 집계 기준 미달(검색이 거의 없음)
    keywords:
      - 철산헬스장        # 206
      - 광명헬스장        # 100
      - 철산역헬스장      # 90
      - 철산PT            # 42
      - 철산헬스          # 30
      - 광명크로스핏      # 19
      - 철산동헬스장      # 15
      - 광명PT            # 8
      - 철산크로스핏      # 8
      - 철산역PT          # 3
      - 철산역 헬스       # 2
      - 철산하이록스      # 1 (2026-05부터 검색 시작, 최근 월 기준 약 4)
      - 광명하이록스      # 1
      - 철산그룹PT        # 0
      - 철산역 크로스핏   # 0
      - 철산역 운동       # 0
      - 철산역 하이록스   # 0
      - 철산역 그룹피티   # 0
      - 철산팀트레이닝    # 0
      - 광명그룹PT        # 0
      - 광명그룹운동      # 0
    # 회원들이 실제로 가장 많이 검색하는 키워드 — 대시보드에서 ★로 강조
    focus_keywords:
      - 철산헬스장
      - 광명헬스장
      - 철산역헬스장
      - 철산PT

  - name: TeamPoise
    label: 팀포이즈(광교)
    place_aliases:
      - 팀포이즈
      - 팀 포이즈
      - Team Poise
      - 팀포이즈 광교
    # 아직 sleekboostls (구 Slickboost 시절 아이디). teampoise로 변경 검토 중 —
    # 실제로 바꾸면 이 줄도 같이 바꿔야 한다.
    blog_ids:
      - sleekboostls
    # 검색량 순으로 정렬. # 뒤 숫자 = 광교헬스장=100 기준 상대값 (같은 조회 조건)
    keywords:
      - 광교헬스장        # 100
      - 광교PT            # 90
      - 상현역헬스장      # 35
      - 상현동헬스장      # 19
      - 수지헬스장        # 17
      - 광교크로스핏      # 13
      - 광교중앙역헬스장  # 12
      - 상현역PT          # 6
      - 수지PT            # 1
      - 수지크로스핏      # 1
      - 광교하이록스      # 0.3 (2026-05부터 증가 중)
      - 상현헬스장        # 0.3
      - 광교그룹운동      # 0
      - 상현그룹 PT       # 0
      - 상현그룹 트레이닝 # 0
      - 상현 하이록스     # 0
      - 상현 운동         # 0
    focus_keywords:
      - 광교헬스장
      - 광교PT
      - 상현역헬스장
      - 상현동헬스장
