    s.values.forEach((v, i) => {
      if (!v) return;
      svg += `<circle cx="${x(i)}" cy="${y(v)}" r="${s.focus ? 4.5 : 2.5}" fill="${c}" opacity="${op}"
               stroke="var(--surface-1)" stroke-width="${s.focus ? 2 : 1}"/>`;
    });

    // 직접 라벨 — 강조 키워드 + 현재 순위가 있는 키워드만 (라벨이 넘치지 않게)
    if (!s.focus && !s.values[s.values.length - 1]) return;
    for (let i = s.values.length - 1; i >= 0; i--) {
      if (s.values[i]) { ends.push({ y: y(s.values[i]), name: (s.focus ? '★' : '') + s.name, c, rank: s.values[i] }); break; }
    }
  });

  // 직접 라벨 충돌 방지 — 위에서부터 최소 간격 확보
  ends.sort((a, b) => a.y - b.y);
  const GAP = 15;
  ends.forEach((e, i) => { if (i && e.y - ends[i - 1].y < GAP) e.y = ends[i - 1].y + GAP; });
  ends.forEach(e => {
    svg += `<text x="${PL + plotW + 10}" y="${e.y + 4}" font-size="11"
             fill="var(--text-secondary)">
              <tspan fill="${e.c}">■</tspan> ${esc(e.name)} ${e.rank}위
            </text>`;
  });

  svg += `<rect id="hit${pi}" x="${PL}" y="${PT}" width="${plotW}" height="${plotH}"
           fill="transparent" style="cursor:crosshair"/></svg>`;

  const rest = panel.series.filter(s => !s.focus).length;
  const legend = panel.series.filter(s => s.focus).map(s =>
    `<span><i style="background:${s.color}"></i><span class="star">★</span>${esc(s.name)}</span>`).join('')
    + (rest ? `<span><i style="background:var(--text-muted)"></i>그 외 ${rest}개 키워드</span>` : '');

  return `<div class="card">
            <h3>${esc(panel.title.split(" · ").pop())}</h3>
            <p>${esc(panel.note)}</p>
            ${svg}
            <div class="legend">${legend}</div>
          </div>`;
}

// 패널 id(pi)는 전체 기준 인덱스를 유지한다 — 툴팁이 그걸로 찾는다
CI.forEach((label, ci) => {
  document.getElementById('charts' + ci).innerHTML = DATA.panels
    .map((p, pi) => p.center === label ? drawPanel(p, pi) : '').join('');
});

/* ---------- 호버 툴팁 ---------- */
const tip = document.getElementById('tip');
DATA.panels.forEach((panel, pi) => {
  const hit = document.getElementById('hit' + pi);
  const cross = document.getElementById('cross' + pi);
  const svg = hit.ownerSVGElement;
  const n = DATA.dates.length;

  hit.addEventListener('mousemove', ev => {
    const box = svg.getBoundingClientRect();
    const sx = (ev.clientX - box.left) / box.width * W;
    const i = n === 1 ? 0
      : Math.max(0, Math.min(n - 1, Math.round((sx - PL) / (plotW / (n - 1)))));
    const px = n === 1 ? PL + plotW / 2 : PL + (i / (n - 1)) * plotW;
    cross.setAttribute('x1', px); cross.setAttribute('x2', px);
    cross.setAttribute('opacity', '1');

    tip.innerHTML = `<b>${DATA.dates[i]} · ${esc(panel.title)}</b>` +
      panel.series.filter(s => s.focus || s.values[i]).map(s => {
        const v = s.values[i];
        return `<div><i style="background:${s.color}"></i>${s.focus ? '★' : ''}${esc(s.name)} — ${v ? v + '위' : '미노출'}</div>`;
      }).join('');
    tip.style.opacity = '1';
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - tw - 10) + 'px';
    tip.style.top = Math.max(8, ev.clientY - th - 12) + 'px';
  });
  hit.addEventListener('mouseleave', () => {
    tip.style.opacity = '0';
    cross.setAttribute('opacity', '0');
  });
});

/* ---------- 표로 보기 (접근성 릴리프) ---------- */
const tableHtml = panel => `
  <table>
    <caption>${esc(panel.title.split(" · ").pop())}</caption>
    <thead><tr><th>키워드</th>${DATA.dates.map(d => `<th class="num">${d.slice(5)}</th>`).join('')}</tr></thead>
    <tbody>${panel.series.map(s => `
      <tr${s.focus ? ' class="focus"' : ''}>
        <td><span class="sw" style="background:${s.color}"></span>${star(s.focus)}${esc(s.name)}</td>
        ${s.values.map(v => `<td class="num">${v === null ? '<span class="miss">—</span>' : v + '위'}</td>`).join('')}
      </tr>`).join('')}
    </tbody>
  </table>`;
CI.forEach((label, ci) => {
  document.getElementById('tables' + ci).innerHTML =
    DATA.panels.filter(p => p.center === label).map(tableHtml).join('');
});
</script>
</body>
</html>
